# Gates a running origin on request, without deploying anything. Releases run this same gate
# themselves (.github/workflows/release.yml), so this no longer fires on push: a gate that runs
# after an uncontrolled deploy can only report damage it had no chance to prevent.
name: Release gate

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Web origin to gate"
        required: false
        default: "https://unfiled-web.vercel.app"

concurrency:
  group: release-gate
  cancel-in-progress: false

# The gate reads a running origin and writes nothing back to the repository. Naming that here keeps
# the workflow that runs against production with real secrets on the same narrow token as the two
# workflows around it, instead of whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  api-gate:
    name: Live API gate (real operations, synthetic account)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Run the live API gate
        env:
          UNFILED_GATE_WEB_ORIGIN: ${{ github.event.inputs.origin || 'https://unfiled-web.vercel.app' }}
          UNFILED_GATE_OPENAI_API_KEY: ${{ secrets.UNFILED_GATE_OPENAI_API_KEY }}
          UNFILED_GATE_CRON_SECRET: ${{ secrets.UNFILED_GATE_CRON_SECRET }}
          UNFILED_GATE_SUPABASE_URL: ${{ secrets.UNFILED_GATE_SUPABASE_URL }}
          UNFILED_GATE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UNFILED_GATE_SUPABASE_SERVICE_ROLE_KEY }}
          UNFILED_GATE_OUTPUT: live-gate-api.json
        run: node scripts/operations/live-gate/api-gate.mjs
      - name: Keep the content-free summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gate-api
          path: live-gate-api.json
