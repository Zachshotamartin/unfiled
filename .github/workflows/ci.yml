# Every check a commit has to pass. The lanes are separate jobs on purpose: they have no
# dependencies on one another, so they run at the same time and a red lane names what broke without
# a reader having to find the failing step inside a half-hour log. The `ci` job at the bottom is the
# single required check, and .github/workflows/release.yml refuses to release a commit whose CI run
# is not green, so this file is what stands between a merge and production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded pull-request run is wasted work, but a superseded main run is the only evidence
  # that its commit is releasable, so main runs are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "22.18.0"
  PNPM_VERSION: "10.14.0"
  SUPABASE_CLI_VERSION: "2.116.0"
  # Turbo's filesystem cache, restored per lane so lint, typecheck, coverage and build stop
  # rebuilding the same package graph from zero on every run. `.turbo` is already gitignored.
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Format, lint, boundaries, and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-static-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check package boundaries and OpenAPI
        run: pnpm check:boundaries && pnpm check:openapi

      - name: Typecheck
        run: pnpm typecheck

  secrets:
    name: Committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: Unit, contract, and operations coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-unit-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and contract coverage
        run: pnpm test:coverage

      - name: Release probe and live-gate checks
        run: pnpm check:release-probe && pnpm test:live-gate-checks && pnpm test:release

  capacity:
    name: Capacity gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-capacity-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-capacity-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-capacity-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verifier production capacity gate
        run: pnpm --filter @unfiled/verifier test:capacity

      - name: Organizer encrypted retrieval capacity gate
        run: pnpm test:retrieval-capacity

      - name: Isolated search encrypted exact-scan capacity gate
        run: pnpm test:search-capacity

  evaluations:
    name: Deterministic routing evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-evaluations-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-evaluations-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-evaluations-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic routing evaluation
        run: pnpm eval:routing

      - name: Production-pipeline deterministic routing evaluation
        run: pnpm eval:routing:pipeline

  database:
    name: Schema, pgTAP, and trust domain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-database-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-database-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-database-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from zero
        run: supabase db reset --local

      - name: Lint database schema
        run: supabase db lint --local --level warning

      - name: Run database tests
        run: supabase test db

      - name: Run organizer lock-order concurrency regression
        run: pnpm test:db:concurrency

      - name: Run Milestone F semantic trust-domain integration
        run: pnpm test:search-trust-domain

  e2e:
    name: Built servers and HTTP end to end
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-e2e-${{ runner.os }}-

      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL client for local HTTP E2E
        run: psql --version

      - name: Build web, worker, verifier, organizer, search, and shared packages
        run: pnpm build

      - name: Smoke built isolated servers
        run: pnpm --filter @unfiled/worker --filter @unfiled/verifier --filter @unfiled/organizer --filter @unfiled/search-service test:built-server

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from zero
        run: supabase db reset --local

      - name: Run Milestones B–F local HTTP E2E
        run: pnpm test:http:e2e

  native-ios:
    name: iOS app and widget (unsigned build)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          XCODEGEN_ARCHIVE="${RUNNER_TEMP}/xcodegen.zip"
          XCODEGEN_INSTALL_ROOT="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "${XCODEGEN_ARCHIVE}"
          printf '%s  %s\n' "${XCODEGEN_SHA256}" "${XCODEGEN_ARCHIVE}" | shasum -a 256 --check -
          unzip -q "${XCODEGEN_ARCHIVE}" -d "${XCODEGEN_INSTALL_ROOT}"
          printf '%s\n' "${XCODEGEN_INSTALL_ROOT}/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Report native toolchain
        run: |
          xcodebuild -version
          xcodegen --version
          swift --version

      - name: Declare credential and signing boundary
        run: >-
          echo "::notice::This lane validates an unsigned iOS Simulator build only.
          It does not use Apple credentials, validate provisioning or App Groups on-device,
          create a signed archive, or deploy to TestFlight or the App Store."

      - name: Generate the Xcode project twice from the canonical manifest
        run: |
          pnpm ios:generate
          pnpm ios:generate

      - name: Inspect generated targets and capability wiring
        run: pnpm ios:inspect

      - name: Resolve the SQLCipher GRDB package graph
        run: pnpm ios:resolve

      - name: Require every generated project file to be current
        run: |
          UNFILED_GENERATED_STATUS="$(git status --porcelain --untracked-files=all -- apps/ios/Unfiled.xcodeproj)"
          if [[ -n "${UNFILED_GENERATED_STATUS}" ]]; then
            printf '%s\n' "${UNFILED_GENERATED_STATUS}"
            exit 1
          fi

      # This lane compiles against a generic destination, which boots no simulator, and does not
      # run the XCTest bundle. GitHub-hosted macOS runners hang on simulator boot often enough to
      # matter -- actions/runner-images#12725 (macos-15 only, hang correlates with which image
      # provisioner the job lands on), #13143 and #13264 -- and this repository hit it: the same
      # content took 223s on a pull-request runner and was still stuck after 26 minutes on the
      # push runner minutes later, twice, both cancelled by hand.
      #
      # Nothing is deleted. The 316 XCTest cases and their target are untouched in
      # apps/ios/UnfiledTests, and `pnpm ios:test` still runs them on a simulator locally -- with
      # an explicit boot, a wall-clock deadline and a heartbeat, all kept working for that use.
      #
      # To run them here again, set the repository variable RUN_IOS_SIMULATOR_TESTS to "true"
      # (Settings, Secrets and variables, Actions, Variables). That is the whole switch: no code
      # change, and the step below is kept in place so it cannot rot into something that no longer
      # runs. Compiling for the simulator SDK still catches every compile error the tests would.
      - name: Build the iOS app for the simulator SDK
        run: pnpm ios:build

      - name: Run iOS unit tests in a simulator
        if: ${{ vars.RUN_IOS_SIMULATOR_TESTS == 'true' }}
        run: pnpm ios:test

  # Packaging evidence for the commit a release can ship: the Release configuration archives,
  # names the production origin, carries its privacy manifest, and stays iPhone-only with no
  # embedded extension. It is unsigned, so per ADR-0010 it is packaging evidence only and no
  # release statement may infer signing or device correctness from it. Pull requests skip it;
  # only a commit on main can be released.
  #
  # It is a job rather than a step of the lane above because it shares nothing with it: a Release
  # archive for a generic iOS device, into its own fresh DerivedData, is a second complete compile
  # of the app and of SQLCipher and GRDB. Run as a step it was serialised after the tests, so every
  # merge waited for both in turn while a pull request waited for neither. Run as a job the two
  # compile at the same time and a merge waits for the longer of them.
  native-ios-archive:
    name: iOS Release archive packaging (unsigned)
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          XCODEGEN_ARCHIVE="${RUNNER_TEMP}/xcodegen.zip"
          XCODEGEN_INSTALL_ROOT="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "${XCODEGEN_ARCHIVE}"
          printf '%s  %s\n' "${XCODEGEN_SHA256}" "${XCODEGEN_ARCHIVE}" | shasum -a 256 --check -
          unzip -q "${XCODEGEN_ARCHIVE}" -d "${XCODEGEN_INSTALL_ROOT}"
          printf '%s\n' "${XCODEGEN_INSTALL_ROOT}/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Generate the Xcode project from the canonical manifest
        run: pnpm ios:generate

      - name: Verify the Release archive packaging
        run: pnpm ios:archive-preflight

  infrastructure:
    name: KMS and workload policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Check Terraform formatting
        working-directory: infra/aws-kms
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        working-directory: infra/aws-kms
        run: terraform init -backend=false -input=false

      - name: Validate KMS and exact-subject policies
        working-directory: infra/aws-kms
        run: terraform validate -no-color

      - name: Test key lifecycle and five-workload isolation contracts
        working-directory: infra/aws-kms
        run: terraform test -no-color

  ci:
    name: CI
    if: always()
    needs:
      [
        static,
        secrets,
        unit,
        capacity,
        evaluations,
        database,
        e2e,
        native-ios,
        native-ios-archive,
        infrastructure
      ]
    runs-on: ubuntu-latest
    steps:
      # Every lane, by name. A lane that was cancelled or skipped is not a lane that passed, so
      # only `success` is accepted and the failing names are printed before the job exits.
      - name: Require every CI lane
        env:
          LANE_RESULTS: >-
            static=${{ needs.static.result }}
            secrets=${{ needs.secrets.result }}
            unit=${{ needs.unit.result }}
            capacity=${{ needs.capacity.result }}
            evaluations=${{ needs.evaluations.result }}
            database=${{ needs.database.result }}
            e2e=${{ needs.e2e.result }}
            native-ios=${{ needs.native-ios.result }}
            infrastructure=${{ needs.infrastructure.result }}
          # The archive lane runs only on a push, so its correct result depends on the event: it
          # must have succeeded on a push, and must have been skipped on a pull request. Comparing
          # against the expectation rather than accepting "skipped" everywhere is what stops a
          # release-bound commit from passing CI while its packaging evidence never ran.
          ARCHIVE_RESULT: ${{ needs.native-ios-archive.result }}
          ARCHIVE_EXPECTED: ${{ github.event_name == 'push' && 'success' || 'skipped' }}
        run: |
          failed=""
          for lane in ${LANE_RESULTS}; do
            printf '%s\n' "${lane}"
            case "${lane}" in
              *=success) ;;
              *) failed="${failed} ${lane%%=*}" ;;
            esac
          done
          printf 'native-ios-archive=%s (expected %s)\n' "${ARCHIVE_RESULT}" "${ARCHIVE_EXPECTED}"
          if [[ "${ARCHIVE_RESULT}" != "${ARCHIVE_EXPECTED}" ]]; then
            failed="${failed} native-ios-archive"
          fi
          if [[ -n "${failed}" ]]; then
            printf 'CI is red. Lanes that did not pass:%s\n' "${failed}" >&2
            exit 1
          fi
