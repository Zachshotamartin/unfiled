# Every server-side check a commit has to pass. The lanes are separate jobs on purpose: they have
# no dependencies on one another, so they run at the same time and a red lane names what broke
# without a reader having to find the failing step inside a half-hour log. The phone app has its
# own workflow, .github/workflows/ci-ios.yml, so neither waits for the other.
#
# `changes` reads the diff first. A commit that touches only the phone app skips every lane here
# except the secret scan, and the `ci` job at the bottom still reports; it is one of the two
# required checks on main (with `CI iOS`), and .github/workflows/release.yml refuses to release a
# commit unless both are green, so this file is what stands between a merge and production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded pull-request run is wasted work, but a superseded main run is the only evidence
  # that its commit is releasable, so main runs are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "22.18.0"
  PNPM_VERSION: "10.14.0"
  SUPABASE_CLI_VERSION: "2.116.0"
  # Turbo's filesystem cache, restored per lane so lint, typecheck, coverage and build stop
  # rebuilding the same package graph from zero on every run. `.turbo` is already gitignored.
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.lanes.outputs.web }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name the lanes this change can affect
        id: lanes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/workflows/scripts/changed-lanes.sh "${BASE_SHA}" "${HEAD_SHA}" | tee -a "${GITHUB_OUTPUT}"

  static:
    name: Format, lint, boundaries, and types
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-static-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check package boundaries and OpenAPI
        run: pnpm check:boundaries && pnpm check:openapi

      - name: Typecheck
        run: pnpm typecheck

  secrets:
    name: Committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: Unit, contract, and operations coverage
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-unit-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and contract coverage
        run: pnpm test:coverage

      - name: Release probe and live-gate checks
        run: pnpm check:release-probe && pnpm test:live-gate-checks && pnpm test:release

  capacity:
    name: Capacity gates
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-capacity-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-capacity-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-capacity-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verifier production capacity gate
        run: pnpm --filter @unfiled/verifier test:capacity

      - name: Organizer encrypted retrieval capacity gate
        run: pnpm test:retrieval-capacity

      - name: Isolated search encrypted exact-scan capacity gate
        run: pnpm test:search-capacity

  evaluations:
    name: Deterministic routing evaluations
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-evaluations-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-evaluations-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-evaluations-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic routing evaluation
        run: pnpm eval:routing

      - name: Production-pipeline deterministic routing evaluation
        run: pnpm eval:routing:pipeline

  database:
    name: Schema, pgTAP, and trust domain
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-database-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-database-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-database-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from zero
        run: supabase db reset --local

      - name: Lint database schema
        run: supabase db lint --local --level warning

      - name: Run database tests
        run: supabase test db

      - name: Run organizer lock-order concurrency regression
        run: pnpm test:db:concurrency

      - name: Run Milestone F semantic trust-domain integration
        run: pnpm test:search-trust-domain

  e2e:
    name: Built servers and HTTP end to end
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore the turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-e2e-${{ runner.os }}-

      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL client for local HTTP E2E
        run: psql --version

      - name: Build web, worker, verifier, organizer, search, and shared packages
        run: pnpm build

      - name: Smoke built isolated servers
        run: pnpm --filter @unfiled/worker --filter @unfiled/verifier --filter @unfiled/organizer --filter @unfiled/search-service test:built-server

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from zero
        run: supabase db reset --local

      - name: Run Milestones B–F local HTTP E2E
        run: pnpm test:http:e2e

  infrastructure:
    name: KMS and workload policy
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Check Terraform formatting
        working-directory: infra/aws-kms
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        working-directory: infra/aws-kms
        run: terraform init -backend=false -input=false

      - name: Validate KMS and exact-subject policies
        working-directory: infra/aws-kms
        run: terraform validate -no-color

      - name: Test key lifecycle and five-workload isolation contracts
        working-directory: infra/aws-kms
        run: terraform test -no-color

  ci:
    name: CI
    if: always()
    needs: [changes, static, secrets, unit, capacity, evaluations, database, e2e, infrastructure]
    runs-on: ubuntu-latest
    steps:
      # Each lane is compared against what this change called for: a lane the diff asked for must
      # have succeeded, and a lane it did not ask for must have been skipped. The secret scan runs
      # for every change. Accepting "skipped" only where the diff explains it is what keeps a
      # cancelled or failed lane from passing.
      - name: Require every lane the change called for
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          WEB_EXPECTED: ${{ needs.changes.outputs.web == 'true' && 'success' || 'skipped' }}
          LANE_RESULTS: >-
            static=${{ needs.static.result }}
            unit=${{ needs.unit.result }}
            capacity=${{ needs.capacity.result }}
            evaluations=${{ needs.evaluations.result }}
            database=${{ needs.database.result }}
            e2e=${{ needs.e2e.result }}
            infrastructure=${{ needs.infrastructure.result }}
        run: |
          failed=""
          expect() {
            printf '%s=%s (expected %s)\n' "$1" "$2" "$3"
            if [[ "$2" != "$3" ]]; then
              failed="${failed} $1"
            fi
          }
          expect changes "${CHANGES_RESULT}" success
          expect secrets "${SECRETS_RESULT}" success
          for lane in ${LANE_RESULTS}; do
            expect "${lane%%=*}" "${lane#*=}" "${WEB_EXPECTED}"
          done
          if [[ -n "${failed}" ]]; then
            printf 'CI is red. Lanes that did not pass:%s\n' "${failed}" >&2
            exit 1
          fi
