name: Unfiled

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Preview: release
  Release: release

configFiles:
  Debug: Config/Development.xcconfig
  Preview: Config/Preview.xcconfig
  Release: Config/Production.xcconfig

packages:
  GRDB:
    url: https://github.com/sqlcipher/GRDB.swift
    exactVersion: 7.10.0

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Unfiled:
    type: application
    platform: iOS
    sources:
      - path: Unfiled
      - path: Shared
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Unfiled/Supporting/Unfiled.entitlements
        INFOPLIST_FILE: Unfiled/Supporting/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(UNFILED_APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Unfiled
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"

  UnfiledTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnfiledTests
    dependencies:
      - target: Unfiled
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(UNFILED_APP_BUNDLE_IDENTIFIER).tests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Unfiled.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Unfiled
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Unfiled Development:
    build:
      targets:
        Unfiled: all
        UnfiledTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UnfiledTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  Unfiled Preview:
    build:
      targets:
        Unfiled: all
    run:
      config: Preview
    test:
      config: Preview
      targets:
        - UnfiledTests
    profile:
      config: Preview
    analyze:
      config: Preview
    archive:
      config: Preview

  Unfiled:
    build:
      targets:
        Unfiled: all
    run:
      config: Release
    test:
      config: Release
      targets:
        - UnfiledTests
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
